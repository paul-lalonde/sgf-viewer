<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGF viewer</title>
  <link rel="stylesheet" href="/viewer/style.css">
</head>
<body>
  <aside id="filepane">
    <div id="filehead">
      <button id="hidefiles" title="Hide file browser (f)">&#171;</button>
      <button id="up" title="Parent directory">&#8593;</button>
      <span id="path">/</span>
    </div>
    <div id="filelist"></div>
  </aside>
  <button id="showfiles" title="Show file browser (f)">files &#187;</button>

  <main>
    <div id="info"></div>
    <div id="boardwrap"><canvas id="board"></canvas></div>
    <div id="controls">
      <button id="b-prevfile" title="Previous file (p)">&#8676; file</button>
      <span class="sep"></span>
      <button id="b-start" title="Start (Home)">|&#9664;</button>
      <button id="b-back10" title="Back 10 (PgUp)">&#9664;&#9664;</button>
      <button id="b-prev" title="Previous move (&#8592;)">&#9664;</button>
      <button id="b-next" title="Next move (&#8594;)">&#9654;</button>
      <button id="b-fwd10" title="Forward 10 (PgDn)">&#9654;&#9654;</button>
      <button id="b-end" title="End (End)">&#9654;|</button>
      <span class="sep"></span>
      <button id="b-varup" title="Previous variation (&#8593;)">&#9650; var</button>
      <button id="b-vardown" title="Next variation (&#8595;)">&#9660; var</button>
      <span class="sep"></span>
      <button id="b-nextfile" title="Next file (n)">file &#8677;</button>
    </div>
    <div id="movecount"></div>
    <div id="comment"></div>
  </main>

  <aside id="treepane">
    <div id="treehead">game tree</div>
    <div id="tree"></div>
  </aside>

  <script type="module" src="/viewer/app.js"></script>
</body>
</html>
