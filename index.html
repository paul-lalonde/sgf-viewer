<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGF viewer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/viewer/style.css">
</head>
<body>
  <aside id="filepane">
    <div id="filehead">
      <button id="hidefiles" title="Hide file browser (f)">&#171;</button>
      <button id="up" title="Parent directory">&#8593;</button>
      <span id="path">/</span>
    </div>
    <div id="filelist"></div>
  </aside>
  <button id="showfiles" title="Show file browser (f)">files &#187;</button>

  <main>
    <div id="info"></div>
    <div id="boardwrap"><canvas id="board"></canvas></div>
    <div id="controls">
      <button id="b-prevfile" title="Previous file (p)">&#8676; file</button>
      <span class="sep"></span>
      <button id="b-start" title="Start (Home)">|&#9664;</button>
      <button id="b-back10" title="Back 10 (PgUp)">&#9664;&#9664;</button>
      <button id="b-prev" title="Previous move (&#8592;)">&#9664;</button>
      <button id="b-next" title="Next move (&#8594;)">&#9654;</button>
      <button id="b-fwd10" title="Forward 10 (PgDn)">&#9654;&#9654;</button>
      <button id="b-end" title="End (End)">&#9654;|</button>
      <span class="sep"></span>
      <button id="b-varup" title="Previous variation (&#8593;)">&#9650; var</button>
      <button id="b-vardown" title="Next variation (&#8595;)">&#9660; var</button>
      <span class="sep"></span>
      <button id="b-nextfile" title="Next file (n)">file &#8677;</button>
    </div>
    <div id="movecount"></div>
    <div id="feedback"></div>
    <div id="comment"></div>
  </main>

  <aside id="treepane">
    <div id="treehead">game tree</div>
    <div id="tree"></div>
    <div id="editpane">
      <div id="tools">
        <button class="tool active" data-tool="play" title="Play moves">play</button>
        <button class="tool" data-tool="triangle" title="Triangle mark">&#9651;</button>
        <button class="tool" data-tool="square" title="Square mark">&#9633;</button>
        <button class="tool" data-tool="circle" title="Circle mark">&#9675;</button>
        <button class="tool" data-tool="x" title="X mark">&#10005;</button>
        <button class="tool" data-tool="label" title="Letter label">abc</button>
        <span class="sep"></span>
        <button class="tool" id="solvemode" title="Tsumego solve mode (t)">tsumego</button>
        <button class="tool" id="enginemode" title="Play against KataGo (e)">vs engine</button>
        <button class="tool" id="exploremode" title="Walk KataGo's top moves (x)">explore</button>
        <button class="tool" id="scorebtn" title="Estimate score & territory (s)">score</button>
        <select id="strength" title="Engine strength (human-rank imitation)">
          <option value="rank_15k">15 kyu</option>
          <option value="rank_12k">12 kyu</option>
          <option value="rank_10k" selected>10 kyu</option>
          <option value="rank_8k">8 kyu</option>
          <option value="rank_5k">5 kyu</option>
          <option value="rank_3k">3 kyu</option>
          <option value="rank_1k">1 kyu</option>
          <option value="rank_1d">1 dan</option>
          <option value="rank_3d">3 dan</option>
          <option value="">max</option>
        </select>
      </div>
      <textarea id="commentbox" rows="4" spellcheck="false"
                placeholder="comment for current node"></textarea>
      <div id="saverow">
        <button id="new" title="Start a new game record">new</button>
        <input id="savename" spellcheck="false" placeholder="filename.sgf">
        <button id="save" title="Save to the current directory">save</button>
      </div>
      <div id="savestatus"></div>
    </div>
  </aside>

  <script type="module" src="/viewer/app.js"></script>
</body>
</html>
